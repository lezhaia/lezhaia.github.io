<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos — William</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/79249980?v=4" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paper.css">
  <style>
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px 0 0;
      font-family: var(--hand);
    }
    header h1 { font-size: clamp(48px, 8vw, 80px); line-height: 1; transform: rotate(-2deg); }
    header a { font-size: 24px; text-decoration: none; color: var(--pencil); }
    header a:hover { color: var(--ink); }
    .note { font-family: var(--hand); font-size: 22px; color: var(--pencil); margin: 10px 0 48px 4px; }

    .board {
      flex: 1;
      columns: 3 280px;
      column-gap: 36px;
      padding: 14px 0 72px;
    }

    .print {
      background: #fffdf8;
      padding: 12px 12px 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 24px -12px rgba(60,40,10,.35);
      transform: rotate(var(--r, 0deg));
      transition: transform .25s;
      position: relative;
      cursor: zoom-in;
      break-inside: avoid;
      display: inline-block;
      width: 100%;
      margin: 14px 0 34px;
    }
    .print:hover { transform: rotate(0deg) scale(1.02); z-index: 2; }
    .print::before {               /* tape */
      content: "";
      position: absolute;
      top: -12px; left: 50%;
      width: 84px; height: 24px;
      transform: translateX(-50%) rotate(var(--t, -3deg));
      background: rgba(225, 214, 180, .7);
      box-shadow: 0 1px 1px rgba(0,0,0,.05);
    }
    .print img { width: 100%; display: block; background: #ddd6c8; min-height: 140px; }
    .print figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-top: 10px;
      font-family: var(--hand);
      font-size: 22px;
      line-height: 1.1;
    }
    .print figcaption small { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 11px; color: var(--pencil); text-align: right; }

    .print:nth-child(6n+1) { --r: -1.6deg; --t: 4deg; }
    .print:nth-child(6n+2) { --r: 1.2deg; --t: -5deg; }
    .print:nth-child(6n+3) { --r: -0.6deg; --t: 2deg; }
    .print:nth-child(6n+4) { --r: 1.8deg; --t: -2deg; }
    .print:nth-child(6n+5) { --r: -1.1deg; --t: 5deg; }
    .print:nth-child(6n+6) { --r: 0.8deg; --t: -4deg; }

    .viewer {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(20, 18, 15, .94);
      display: none; flex-direction: column;
      color: #e9e3d6; font-family: var(--hand); font-size: 24px;
    }
    .viewer.open { display: flex; }
    .viewer .img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
    .viewer img { max-width: 100%; max-height: 100%; background: #fffdf8; padding: 10px; }
    .viewer .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 20px 18px; }
    .viewer button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 2px 8px; }
    .viewer button:hover { color: var(--red); }

    @media (max-width: 640px) {
      .board { columns: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Photos</h1>
      <a href="./">← back to the game</a>
    </header>
    <p class="note">Sony A7M4 · GM 24-70 II · Sigma 16-28 II</p>

    <section class="board">
      <figure class="print"><img src="https://i.meee.com.tw/s08kO0W.jpg" alt="Graduation" loading="lazy"><figcaption>Graduation<small>Natural light · 1/200s · ISO 100</small></figcaption></figure>
      <figure class="print"><img src="https://i.meee.com.tw/iepKcEU.jpg" alt="Concert" loading="lazy"><figcaption>Concert<small>F4.5 · 1/160s · ISO 800</small></figcaption></figure>
      <figure class="print"><img src="https://i.meee.com.tw/V55Ckw9.jpg" alt="On stage" loading="lazy"><figcaption>On stage<small>Stage light · 1/250s · ISO 1600</small></figcaption></figure>
      <figure class="print"><img src="https://i.meee.com.tw/lr51dGI.jpg" alt="Workshop" loading="lazy"><figcaption>Workshop<small>Indoor light · 1/125s · ISO 400</small></figcaption></figure>
      <figure class="print"><img src="https://i.meee.com.tw/LflQqD4.jpg" alt="Class" loading="lazy"><figcaption>Class<small>F5.6 · 1/100s · ISO 320</small></figcaption></figure>
      <figure class="print"><img src="https://i.meee.com.tw/OLSTHa7.jpg" alt="Studio portrait" loading="lazy"><figcaption>Studio portrait<small>Studio light · 1/200s · ISO 100</small></figcaption></figure>
    </section>

    <footer>
      <span>© 2025 William</span>
      <nav>
        <a href="./">Home</a>
        <a href="https://github.com/lezhaia" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </footer>
  </div>

  <div class="viewer" id="viewer">
    <div class="img" id="viewer-area"><img id="viewer-img" alt=""></div>
    <div class="bar">
      <span id="viewer-cap"></span>
      <span><button id="prev">← prev</button><button id="next">next →</button><button id="close">close</button></span>
    </div>
  </div>

  <script>
    const prints = [...document.querySelectorAll(".print")];
    const viewer = document.getElementById("viewer"), vImg = document.getElementById("viewer-img"), vCap = document.getElementById("viewer-cap");
    let cur = 0;
    const show = i => {
      cur = (i + prints.length) % prints.length;
      const img = prints[cur].querySelector("img");
      vImg.src = img.src; vImg.alt = img.alt; vCap.textContent = img.alt;
    };
    const open = i => { show(i); viewer.classList.add("open"); document.body.style.overflow = "hidden"; };
    const close = () => { viewer.classList.remove("open"); document.body.style.overflow = ""; };
    prints.forEach((p, i) => p.addEventListener("click", () => open(i)));
    document.getElementById("prev").onclick = () => show(cur - 1);
    document.getElementById("next").onclick = () => show(cur + 1);
    document.getElementById("close").onclick = close;
    document.getElementById("viewer-area").onclick = e => { if (e.target !== vImg) close(); };
    document.addEventListener("keydown", e => {
      if (!viewer.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(cur - 1);
      if (e.key === "ArrowRight") show(cur + 1);
    });
  </script>
</body>
</html>
