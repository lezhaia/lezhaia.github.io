<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>William</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/79249980?v=4" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paper.css">
  <style>
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 24px;
    }

    .name {
      font-family: var(--hand);
      font-weight: 700;
      font-size: clamp(64px, 12vw, 132px);
      line-height: 0.9;
      transform: rotate(-3deg);
      transform-origin: left bottom;
      display: inline-block;
      position: relative;
      margin-left: -4px;
    }

    .name svg {
      position: absolute;
      left: 2%;
      bottom: -14px;
      width: 96%;
      height: 22px;
      overflow: visible;
    }

    .aside {
      font-family: var(--hand);
      font-size: 24px;
      color: var(--pencil);
      margin: 18px 0 28px 4px;
      transform: rotate(-1deg);
    }

    #runner {
      display: block;
      width: 100%;
      height: clamp(220px, 34vh, 300px);
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <div>
        <h1 class="name">William
          <svg viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true">
            <path d="M2 14 C 60 6, 140 4, 298 9 M 20 18 C 90 12, 180 11, 270 15" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </h1>
      </div>
      <p class="aside">photographs, small tools, FiveM stuff — and a camera that won't stop running.</p>

      <canvas id="runner" tabindex="0" aria-label="Runner game. Press space or tap to jump."></canvas>
    </main>

    <footer>
      <span>© 2025 William</span>
      <nav>
        <a href="photos.html">Photos</a>
        <a href="https://github.com/lezhaia" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </footer>
  </div>

  <script>
    // A hand-drawn runner: a little camera jumping over crates and tripods.
    (() => {
      const cv = document.getElementById("runner");
      const ctx = cv.getContext("2d");
      const INK = "#1b1a17", PENCIL = "#8a8478", RED = "#d23a26";
      const HAND = "'Caveat', 'Comic Sans MS', cursive";

      let W = 0, H = 0, GROUND = 0;
      let state = "idle", player, obstacles, clouds, speed, score, best = 0, nextGap, last = 0, legT = 0, groundOff = 0, idSeq = 0;
      try { best = +localStorage.getItem("runner-best") || 0; } catch (e) {}

      // ---- sketchy drawing helpers (lines "boil" ~8 times a second) ----
      let boil = 0;
      function rng(seed) {
        return () => {
          seed |= 0; seed = seed + 0x6D2B79F5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      let r = rng(1);
      const j = (a) => (r() - 0.5) * 2 * a;

      function line(x1, y1, x2, y2, rough = 1.2, passes = 2) {
        for (let p = 0; p < passes; p++) {
          const mx = (x1 + x2) / 2 + j(rough * 1.5), my = (y1 + y2) / 2 + j(rough * 1.5);
          ctx.beginPath();
          ctx.moveTo(x1 + j(rough), y1 + j(rough));
          ctx.quadraticCurveTo(mx, my, x2 + j(rough), y2 + j(rough));
          ctx.stroke();
        }
      }
      function rect(x, y, w, h, rough) {
        line(x, y, x + w, y, rough); line(x + w, y, x + w, y + h, rough);
        line(x + w, y + h, x, y + h, rough); line(x, y + h, x, y, rough);
      }
      function circle(cx, cy, rad, rough = 1) {
        ctx.beginPath();
        const start = r() * Math.PI * 2, steps = 18;
        for (let i = 0; i <= steps + 2; i++) {
          const a = start + (i / steps) * Math.PI * 2;
          const rr = rad + j(rough);
          const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
      function hatch(x, y, w, h, gap = 5) {
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        for (let k = -h; k < w; k += gap) line(x + k, y + h, x + k + h, y, 0.6, 1);
        ctx.restore();
      }

      // ---- game ----
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = cv.clientWidth; H = cv.clientHeight; GROUND = H - 46;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!player) reset();
        player.y = Math.min(player.y, GROUND - player.h);
        if (state !== "run") draw(performance.now());
      }

      function reset() {
        player = { x: Math.min(70, W * 0.12), y: GROUND - 30, w: 36, h: 30, vy: 0 };
        obstacles = []; speed = 400; score = 0; nextGap = 360;
        clouds = clouds || [0, 1, 2].map(i => ({ x: W * (0.25 + i * 0.3), y: 46 + (i * 23) % 40, s: 0.7 + (i % 2) * 0.4, id: i }));
      }

      function jump() {
        if (state !== "run") { reset(); state = "run"; last = performance.now(); requestAnimationFrame(loop); return; }
        if (player.y >= GROUND - player.h - 0.5) player.vy = -780;
      }

      function spawn() {
        const tripod = Math.random() < 0.3;
        const o = tripod
          ? { kind: "tripod", w: 30, h: 46 + Math.random() * 10 }
          : { kind: "crate", w: 22 + Math.random() * 20, h: 24 + Math.random() * 22 };
        o.x = W + 10; o.id = ++idSeq;
        obstacles.push(o);
        if (!tripod && Math.random() < 0.25) obstacles.push({ kind: "crate", x: o.x + o.w + 2, w: 20, h: 20, id: ++idSeq });
        nextGap = speed * (0.7 + Math.random() * 0.8) + 160;
      }

      function update(dt) {
        speed = Math.min(speed + 10 * dt, 1000);
        score += speed * dt / 40;
        player.vy += 2500 * dt;
        player.y = Math.min(player.y + player.vy * dt, GROUND - player.h);
        if (player.y === GROUND - player.h) player.vy = 0;
        legT += dt; groundOff = (groundOff + speed * dt) % 60;

        obstacles.forEach(o => o.x -= speed * dt);
        obstacles = obstacles.filter(o => o.x + o.w > -20);
        clouds.forEach(c => { c.x -= speed * dt * 0.08 * c.s; if (c.x < -80) c.x = W + 40; });
        const lastO = obstacles[obstacles.length - 1];
        if (!lastO || W - (lastO.x + lastO.w) > nextGap) spawn();

        const p = { x: player.x + 6, y: player.y + 6, w: player.w - 12, h: player.h - 6 };
        for (const o of obstacles) {
          const pad = o.kind === "tripod" ? 6 : 2;
          if (p.x < o.x + o.w - pad && p.x + p.w > o.x + pad && p.y + p.h > GROUND - o.h + 2) {
            state = "over";
            if (score > best) { best = Math.floor(score); try { localStorage.setItem("runner-best", best); } catch (e) {} }
          }
        }
      }

      function drawCamera() {
        const { x, y, w, h } = player;
        r = rng(boil * 31 + 7);
        ctx.strokeStyle = INK; ctx.lineWidth = 2;
        rect(x, y + 7, w, h - 13, 1);
        line(x + 6, y + 7, x + 9, y + 1); line(x + 9, y + 1, x + 19, y + 1); line(x + 19, y + 1, x + 22, y + 7);
        circle(x + w / 2 + 3, y + 7 + (h - 13) / 2, 8, 0.8);
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + w / 2 + 3, y + 7 + (h - 13) / 2, 3, 0, 7); ctx.fill();
        ctx.strokeStyle = RED; line(x + w - 8, y + 4, x + w - 3, y + 4, 0.5);
        ctx.strokeStyle = INK;
        const ground = y >= GROUND - h - 0.5 && state === "run";
        const step = Math.floor(legT * 12) % 2;
        const a = ground ? (step ? 5 : -3) : 4, b = ground ? (step ? -3 : 5) : -4;
        line(x + 10, y + h - 6, x + 10 + a, y + h, 0.4, 1);
        line(x + w - 10, y + h - 6, x + w - 10 + b, y + h, 0.4, 1);
      }

      function drawObstacle(o) {
        r = rng(boil * 131 + o.id * 17);
        const y = GROUND - o.h;
        ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
        if (o.kind === "crate") {
          rect(o.x, y, o.w, o.h, 1);
          ctx.strokeStyle = PENCIL; ctx.lineWidth = 1;
          hatch(o.x + 2, y + 2, o.w - 4, o.h - 4, 6);
        } else {
          const cx = o.x + o.w / 2;
          rect(cx - 7, y, 14, 7, 0.6);
          line(cx, y + 7, cx, y + 16, 0.4);
          line(cx, y + 16, o.x + 1, GROUND, 0.8);
          line(cx, y + 16, o.x + o.w - 1, GROUND, 0.8);
          line(cx, y + 16, cx + 2, GROUND, 0.8);
        }
      }

      function drawCloud(c) {
        r = rng(boil * 7 + c.id * 101);
        ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.2;
        const s = c.s;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y + 14 * s);
        ctx.bezierCurveTo(c.x - 4, c.y + 2 * s, c.x + 14 * s, c.y - 4 * s, c.x + 20 * s, c.y + 4 * s);
        ctx.bezierCurveTo(c.x + 26 * s, c.y - 8 * s, c.x + 48 * s, c.y - 4 * s, c.x + 46 * s, c.y + 8 * s);
        ctx.bezierCurveTo(c.x + 60 * s, c.y + 8 * s, c.x + 60 * s, c.y + 16 * s, c.x + 50 * s, c.y + 16 * s);
        ctx.lineTo(c.x + j(1), c.y + 15 * s + j(1));
        ctx.stroke();
      }

      function draw(now) {
        boil = Math.floor(now / 120);
        ctx.clearRect(0, 0, W, H);
        ctx.lineCap = "round"; ctx.lineJoin = "round";

        clouds.forEach(drawCloud);

        r = rng(boil);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
        for (let gx = 0; gx < W; gx += 120) line(gx, GROUND + j(0.6), Math.min(gx + 124, W), GROUND + j(0.6), 0.8, 1);
        ctx.strokeStyle = PENCIL; ctx.lineWidth = 1;
        r = rng(3);
        for (let gx = -groundOff, n = 0; gx < W; gx += 60, n++) {
          const dy = (n % 3) * 4;
          line(gx + 8, GROUND + 9 + dy, gx + 20, GROUND + 9 + dy, 0.3, 1);
          line(gx + 36, GROUND + 22, gx + 40, GROUND + 22, 0.3, 1);
        }

        obstacles.forEach(drawObstacle);
        drawCamera();

        ctx.fillStyle = PENCIL; ctx.textAlign = "right";
        ctx.font = `600 22px ${HAND}`;
        ctx.fillText(`best ${best}`, W - 64, 26);
        ctx.fillStyle = INK; ctx.font = `700 26px ${HAND}`;
        ctx.fillText(Math.floor(score), W - 8, 27);

        ctx.textAlign = "center";
        if (state === "idle") {
          ctx.fillStyle = INK; ctx.font = `600 28px ${HAND}`;
          ctx.fillText("tap or press space", W / 2, H * 0.36);
        }
        if (state === "over") {
          ctx.save(); ctx.translate(W / 2, H * 0.34); ctx.rotate(-0.04);
          ctx.fillStyle = RED; ctx.font = `700 34px ${HAND}`;
          ctx.fillText("oops.", 0, 0);
          ctx.fillStyle = INK; ctx.font = `600 22px ${HAND}`;
          ctx.fillText("again?", 0, 28);
          ctx.restore();
        }
      }

      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05); last = now;
        update(dt); draw(now);
        if (state === "run") requestAnimationFrame(loop);
      }

      // keep the lines "breathing" while idle
      setInterval(() => { if (state !== "run") draw(performance.now()); }, 120);

      cv.addEventListener("keydown", e => {
        if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); }
      });
      cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.focus(); jump(); });
      // the page is the game, so Space anywhere plays
      document.addEventListener("keydown", e => {
        if (document.activeElement === cv) return;
        if ((e.code === "Space" || e.code === "ArrowUp") && !e.target.closest("a, button, input, textarea")) {
          e.preventDefault(); cv.focus(); jump();
        }
      });
      window.addEventListener("resize", resize);
      resize();
      document.fonts && document.fonts.ready.then(() => state !== "run" && draw(performance.now()));
    })();
  </script>
</body>
</html>
