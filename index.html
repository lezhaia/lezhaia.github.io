<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr.William — Photography</title>
  <meta name="description" content="Through the lens of Mr.William. Photography captured with the SONY A7M4." />
  <link rel="icon" href="https://avatars.githubusercontent.com/u/79249980?v=4" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0d;
      --surface: #161618;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f2f0eb;
      --muted: #8d8a84;
      --accent: #e8b04b;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --gutter: clamp(16px, 4vw, 56px);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f1ea;
        --surface: #ebe6dc;
        --line: rgba(0, 0, 0, 0.12);
        --text: #161514;
        --muted: #6f6a62;
        --accent: #b9791a;
      }
    }
    :root[data-theme="light"] {
      --bg: #f4f1ea;
      --surface: #ebe6dc;
      --line: rgba(0, 0, 0, 0.12);
      --text: #161514;
      --muted: #6f6a62;
      --accent: #b9791a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px var(--gutter);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      filter: grayscale(1);
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    nav a { transition: color 0.2s; }
    nav a:hover { color: var(--text); }

    /* ---------- Hero ---------- */
    .hero {
      padding: clamp(72px, 14vw, 160px) var(--gutter) clamp(48px, 8vw, 96px);
      max-width: 1400px;
      margin: 0 auto;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e5484d;
      box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.18);
      animation: rec 1.6s ease-in-out infinite;
    }

    @keyframes rec { 50% { opacity: 0.25; } }

    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(3rem, 10vw, 8.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .hero h1 em { color: var(--muted); }

    .gear {
      margin-top: clamp(40px, 6vw, 72px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      border-top: 1px solid var(--line);
    }

    .gear div {
      padding: 20px 20px 0 0;
    }

    .gear dt {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .gear dd { font-size: 1.05rem; }

    /* ---------- Gallery ---------- */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 var(--gutter);
      max-width: 1400px;
      margin: 0 auto 28px;
    }

    .section-head h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .section-head span {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 var(--gutter);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(12px, 1.6vw, 24px);
    }

    .shot {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      cursor: zoom-in;
      border: 0;
      padding: 0;
      color: #fff;
      text-align: left;
      font: inherit;
      aspect-ratio: 3 / 2;
    }

    /* editorial rhythm: wide, narrow, narrow, wide... */
    .shot:nth-child(1) { grid-column: span 8; }
    .shot:nth-child(2) { grid-column: span 4; aspect-ratio: auto; }
    .shot:nth-child(3) { grid-column: span 4; aspect-ratio: auto; }
    .shot:nth-child(4) { grid-column: span 8; }
    .shot:nth-child(5) { grid-column: span 6; }
    .shot:nth-child(6) { grid-column: span 6; }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.6s;
      opacity: 0;
    }

    .shot img.loaded { opacity: 1; }

    .shot:hover img,
    .shot:focus-visible img { transform: scale(1.04); }

    .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .shot figcaption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 48px 20px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.72), transparent);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s, transform 0.35s;
    }

    .shot:hover figcaption,
    .shot:focus-visible figcaption { opacity: 1; transform: none; }

    .shot .title {
      font-family: var(--serif);
      font-size: 1.5rem;
      line-height: 1.1;
    }

    .shot .exif {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    .shot .num {
      position: absolute;
      top: 14px;
      left: 16px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.85);
      mix-blend-mode: difference;
    }

    .more {
      max-width: 1400px;
      margin: clamp(48px, 8vw, 96px) auto 0;
      padding: 0 var(--gutter);
      text-align: center;
      color: var(--muted);
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: clamp(64px, 10vw, 128px);
      border-top: 1px solid var(--line);
      padding: 40px var(--gutter);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 24px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    footer blockquote {
      font-family: var(--serif);
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .socials { display: flex; gap: 10px; }

    .socials a {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .socials a:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0b0b0c;
      display: grid;
      grid-template-rows: 1fr auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      color: #f2f0eb;
    }

    .lightbox.open { opacity: 1; pointer-events: auto; }

    .lightbox .stage {
      display: grid;
      place-items: center;
      padding: 64px 72px 16px;
      min-height: 0;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }

    .lightbox .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 16px 24px 24px;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: #a9a59d;
    }

    .lightbox .meta strong {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.5rem;
      color: #f2f0eb;
      margin-right: 16px;
    }

    .lb-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: #f2f0eb;
      font-size: 1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s;
    }

    .lb-btn:hover { background: rgba(255,255,255,0.14); }
    .lb-close { top: 16px; right: 16px; }
    .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }

    /* ---------- Reveal ---------- */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .reveal.in { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 820px) {
      .shot:nth-child(n) { grid-column: span 12; aspect-ratio: 3 / 2; }
      .shot figcaption { opacity: 1; transform: none; flex-direction: column; align-items: flex-start; gap: 4px; }
      .shot .exif { white-space: normal; }
      nav .hide-sm { display: none; }
      .lightbox .stage { padding: 64px 12px 8px; }
      .lb-prev, .lb-next { top: auto; bottom: 18px; transform: none; }
      .lb-prev { left: auto; right: 72px; }
      .lightbox .meta { flex-direction: column; padding-right: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#">
      <img src="https://avatars.githubusercontent.com/u/79249980?v=4" alt="">
      <span>Mr.William</span>
    </a>
    <nav>
      <a href="#work">Work</a>
      <a class="hide-sm" href="#gear">Gear</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow">Photography · Portfolio</p>
    <h1>Through the lens<br><em>of</em> Mr.William</h1>

    <dl class="gear" id="gear">
      <div><dt>Body</dt><dd>SONY A7M4</dd></div>
      <div><dt>Standard</dt><dd>G Master 24-70mm F2.8 II</dd></div>
      <div><dt>Wide</dt><dd>SIGMA 16-28mm F2.8 II</dd></div>
    </dl>
  </section>

  <div class="section-head" id="work">
    <h2>Selected Work</h2>
    <span id="count"></span>
  </div>

  <section class="gallery" id="gallery"></section>

  <p class="more">More projects coming soon…</p>

  <footer id="contact">
    <div>
      <blockquote>“Photography is the art of frozen time.”</blockquote>
      © <span id="year">2025</span> Mr.William. All rights reserved.
    </div>
    <div class="socials">
      <a href="#" aria-label="Flickr"><i class="fa-brands fa-flickr"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://github.com/lezhaia" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="#" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <div class="stage"><img id="lb-img" alt=""></div>
    <div class="meta">
      <div><strong id="lb-title"></strong><span id="lb-exif"></span></div>
      <span id="lb-index"></span>
    </div>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next"><i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <script>
    // Add new photos here — the gallery, counter and lightbox update automatically.
    const photos = [
      { src: "https://i.meee.com.tw/s08kO0W.jpg", title: "Graduation Moment", exif: "Natural light · 1/200s · ISO 100" },
      { src: "https://i.meee.com.tw/iepKcEU.jpg", title: "Concert Crowd",     exif: "F4.5 · 1/160s · ISO 800" },
      { src: "https://i.meee.com.tw/V55Ckw9.jpg", title: "Stage Performance", exif: "Stage light · 1/250s · ISO 1600" },
      { src: "https://i.meee.com.tw/lr51dGI.jpg", title: "Workshop",          exif: "Indoor light · 1/125s · ISO 400" },
      { src: "https://i.meee.com.tw/LflQqD4.jpg", title: "Teaching Moment",   exif: "F5.6 · 1/100s · ISO 320" },
      { src: "https://i.meee.com.tw/OLSTHa7.jpg", title: "Studio Portrait",   exif: "Studio light · 1/200s · ISO 100" }
    ];

    const pad = n => String(n).padStart(2, "0");
    const gallery = document.getElementById("gallery");
    document.getElementById("count").textContent = `${pad(photos.length)} frames`;
    document.getElementById("year").textContent = new Date().getFullYear();

    photos.forEach((p, i) => {
      const fig = document.createElement("figure");
      fig.className = "shot reveal";
      fig.tabIndex = 0;
      fig.setAttribute("role", "button");
      fig.setAttribute("aria-label", `Open ${p.title}`);
      fig.innerHTML = `
        <img src="${p.src}" alt="${p.title}" loading="lazy">
        <span class="num">${pad(i + 1)}</span>
        <figcaption><span class="title">${p.title}</span><span class="exif">${p.exif}</span></figcaption>`;
      const img = fig.querySelector("img");
      const done = () => img.classList.add("loaded");
      img.complete ? done() : (img.onload = done, img.onerror = done);
      fig.addEventListener("click", () => openLb(i));
      fig.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(i); } });
      gallery.appendChild(fig);
    });

    // Scroll reveal
    const io = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        }), { threshold: 0.12 })
      : null;
    document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));

    // Lightbox
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    let current = 0, lastFocus = null;

    function show(i) {
      current = (i + photos.length) % photos.length;
      const p = photos[current];
      lbImg.src = p.src;
      lbImg.alt = p.title;
      document.getElementById("lb-title").textContent = p.title;
      document.getElementById("lb-exif").textContent = p.exif;
      document.getElementById("lb-index").textContent = `${pad(current + 1)} / ${pad(photos.length)}`;
    }

    function openLb(i) {
      lastFocus = document.activeElement;
      show(i);
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      document.getElementById("lb-close").focus();
    }

    function closeLb() {
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (lastFocus) lastFocus.focus();
    }

    document.getElementById("lb-close").onclick = closeLb;
    document.getElementById("lb-prev").onclick = () => show(current - 1);
    document.getElementById("lb-next").onclick = () => show(current + 1);
    lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("stage")) closeLb(); });
    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowLeft") show(current - 1);
      if (e.key === "ArrowRight") show(current + 1);
    });

    // Swipe on touch devices
    let touchX = null;
    lb.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
      touchX = null;
    });
  </script>
</body>
</html>
