<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr.William</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/79249980?v=4" type="image/png">
  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: #888;
      --line: #eee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --text: #eee; --muted: #888; --line: #222; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    a { color: inherit; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 32px 0 0;
    }

    header .name {
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
    }

    header nav a {
      margin-left: 20px;
      text-decoration: none;
      color: var(--muted);
    }

    header nav a:hover { color: var(--text); }

    .intro {
      margin: 64px 0 48px;
      max-width: 520px;
      color: var(--muted);
    }

    .intro p + p { margin-top: 8px; }
    .intro strong { color: var(--text); font-weight: 500; }

    .photos {
      columns: 2;
      column-gap: 20px;
    }

    .photos figure {
      break-inside: avoid;
      margin-bottom: 28px;
      cursor: zoom-in;
    }

    .photos img {
      width: 100%;
      display: block;
      background: var(--line);
      min-height: 120px;
    }

    .photos figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 13px;
    }

    .photos figcaption span:last-child { color: var(--muted); text-align: right; }

    .soon {
      margin: 40px 0 0;
      color: var(--muted);
    }

    footer {
      margin-top: 96px;
      padding: 24px 0 40px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    footer a { margin-left: 16px; text-decoration: none; }
    footer a:first-child { margin-left: 0; }
    footer a:hover { color: var(--text); }

    /* viewer */
    .viewer {
      position: fixed;
      inset: 0;
      background: #000;
      color: #ccc;
      display: none;
      flex-direction: column;
      z-index: 10;
      font-size: 13px;
    }
    .viewer.open { display: flex; }
    .viewer .img {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .viewer img { max-width: 100%; max-height: 100%; }
    .viewer .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 20px 20px;
    }
    .viewer button {
      background: none;
      border: 0;
      color: #ccc;
      font: inherit;
      cursor: pointer;
      padding: 4px 6px;
    }
    .viewer button:hover { color: #fff; }

    @media (max-width: 640px) {
      header { padding-top: 20px; }
      .intro { margin: 40px 0 32px; }
      .photos { columns: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="name" href="./">Mr.William</a>
      <nav>
        <a href="#photos">Photos</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="intro">
      <p><strong>Through the lens of Mr.William.</strong></p>
      <p>Shot on a Sony A7M4, mostly with the G Master 24-70mm II and the Sigma 16-28mm II.</p>
    </section>

    <section class="photos" id="photos">
      <figure data-i="0">
        <img src="https://i.meee.com.tw/s08kO0W.jpg" alt="Graduation" loading="lazy">
        <figcaption><span>Graduation</span><span>Natural light · 1/200s · ISO 100</span></figcaption>
      </figure>
      <figure data-i="1">
        <img src="https://i.meee.com.tw/iepKcEU.jpg" alt="Concert" loading="lazy">
        <figcaption><span>Concert</span><span>F4.5 · 1/160s · ISO 800</span></figcaption>
      </figure>
      <figure data-i="2">
        <img src="https://i.meee.com.tw/V55Ckw9.jpg" alt="On stage" loading="lazy">
        <figcaption><span>On stage</span><span>Stage light · 1/250s · ISO 1600</span></figcaption>
      </figure>
      <figure data-i="3">
        <img src="https://i.meee.com.tw/lr51dGI.jpg" alt="Workshop" loading="lazy">
        <figcaption><span>Workshop</span><span>Indoor light · 1/125s · ISO 400</span></figcaption>
      </figure>
      <figure data-i="4">
        <img src="https://i.meee.com.tw/LflQqD4.jpg" alt="Class" loading="lazy">
        <figcaption><span>Class</span><span>F5.6 · 1/100s · ISO 320</span></figcaption>
      </figure>
      <figure data-i="5">
        <img src="https://i.meee.com.tw/OLSTHa7.jpg" alt="Studio portrait" loading="lazy">
        <figcaption><span>Studio portrait</span><span>Studio light · 1/200s · ISO 100</span></figcaption>
      </figure>
    </section>

    <p class="soon">More soon.</p>

    <footer id="contact">
      <span>“Photography is the art of frozen time.” — © 2025 Mr.William</span>
      <span>
        <a href="#">Instagram</a>
        <a href="#">Flickr</a>
        <a href="https://github.com/lezhaia">GitHub</a>
        <a href="#">Email</a>
      </span>
    </footer>
  </div>

  <div class="viewer" id="viewer">
    <div class="img" id="viewer-close-area"><img id="viewer-img" alt=""></div>
    <div class="bar">
      <span id="viewer-cap"></span>
      <span>
        <button id="prev">← Prev</button>
        <button id="next">Next →</button>
        <button id="close">Close</button>
      </span>
    </div>
  </div>

  <script>
    const figs = [...document.querySelectorAll(".photos figure")];
    const viewer = document.getElementById("viewer");
    const vImg = document.getElementById("viewer-img");
    const vCap = document.getElementById("viewer-cap");
    let cur = 0;

    function show(i) {
      cur = (i + figs.length) % figs.length;
      const f = figs[cur];
      vImg.src = f.querySelector("img").src;
      vImg.alt = f.querySelector("img").alt;
      const [t, e] = f.querySelectorAll("figcaption span");
      vCap.textContent = `${t.textContent} — ${e.textContent}`;
    }
    function open(i) { show(i); viewer.classList.add("open"); document.body.style.overflow = "hidden"; }
    function close() { viewer.classList.remove("open"); document.body.style.overflow = ""; }

    figs.forEach((f, i) => f.addEventListener("click", () => open(i)));
    document.getElementById("prev").onclick = () => show(cur - 1);
    document.getElementById("next").onclick = () => show(cur + 1);
    document.getElementById("close").onclick = close;
    document.getElementById("viewer-close-area").onclick = e => { if (e.target !== vImg) close(); };
    document.addEventListener("keydown", e => {
      if (!viewer.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(cur - 1);
      if (e.key === "ArrowRight") show(cur + 1);
    });
  </script>
</body>
</html>
